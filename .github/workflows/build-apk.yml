name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add SMS plugin and permission
        run: |
          D=android/app/src/main/java/com/clinic/nobat
          mkdir -p $D
          cp android-plugin/*.java $D/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SEND_SMS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nobat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
